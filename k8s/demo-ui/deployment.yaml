---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-ui
  namespace: disputes
  labels:
    app.kubernetes.io/name: demo-ui
    app.kubernetes.io/part-of: dispute-triage
  annotations:
    # Workload Identity: federated to id-demo-ui, which may read only the demo identity
    # provider's private key. No model, no queues, no database, no signing key.
    azure.workload.identity/client-id: ${WI_CLIENT_ID}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-ui
  namespace: disputes
  labels:
    app.kubernetes.io/name: demo-ui
    app.kubernetes.io/part-of: dispute-triage
spec:
  replicas: 1 # a demo screen; Streamlit keeps each browser session in one process
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-ui
        app.kubernetes.io/part-of: dispute-triage
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: demo-ui
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: ${IMAGE}
          ports:
            - name: http
              containerPort: 8501
          envFrom:
            - configMapRef:
                name: demo-ui
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet: { path: /_stcore/health, port: http }
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet: { path: /_stcore/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /_stcore/health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: demo-ui-secrets
