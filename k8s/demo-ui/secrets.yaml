---
# Which Key Vault secret to mount into the demo UI (ADR-0005): the demo identity provider's
# private key, so the UI can log synthetic customers in. Nothing here is a secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: demo-ui-secrets
  namespace: disputes
  labels:
    app.kubernetes.io/name: demo-ui
    app.kubernetes.io/part-of: dispute-triage
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: ${WI_CLIENT_ID}
    tenantId: ${AZURE_TENANT_ID}
    keyvaultName: ${KEYVAULT_NAME}
    objects: |
      array:
        - |
          objectName: demo-idp-private-key
          objectType: secret
