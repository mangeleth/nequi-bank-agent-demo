---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: supervisor
  namespace: disputes
  labels:
    app.kubernetes.io/name: supervisor
    app.kubernetes.io/part-of: dispute-triage
  annotations:
    # Workload Identity: federated to id-supervisor, which may send to the dispute queue and read
    # the database password. It cannot call a model, sign a token, or receive from the queue.
    azure.workload.identity/client-id: ${WI_CLIENT_ID}
# The pod never calls the Kubernetes API. The Entra ID token exchange uses a separate,
# short-lived token that the workload identity webhook mounts.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supervisor
  namespace: disputes
  labels:
    app.kubernetes.io/name: supervisor
    app.kubernetes.io/part-of: dispute-triage
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: supervisor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supervisor
        app.kubernetes.io/part-of: dispute-triage
        azure.workload.identity/use: "true" # asks the webhook to inject the identity token
    spec:
      serviceAccountName: supervisor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: supervisor
          # Count only pods of the same release, so a rolling update spreads the new pods
          # across nodes instead of balancing them against the old ones.
          matchLabelKeys: ["pod-template-hash"]
      containers:
        - name: api
          image: ${IMAGE} # <acr>/supervisor:<git-sha>, set by `make deploy`
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: supervisor
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http } # not ready while either agent is not ready
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: jwt-public-key
              mountPath: /etc/jwt
              readOnly: true
            - name: langfuse-keys
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: jwt-public-key
          configMap:
            name: jwt-public-key
        - name: langfuse-keys
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: supervisor-langfuse
