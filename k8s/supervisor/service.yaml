---
apiVersion: v1
kind: Service
metadata:
  name: supervisor
  namespace: disputes
  labels:
    app.kubernetes.io/name: supervisor
    app.kubernetes.io/part-of: dispute-triage
spec:
  type: ClusterIP # reachable only from inside the cluster: http://supervisor.disputes
  selector:
    app.kubernetes.io/name: supervisor
  ports:
    - name: http
      port: 80
      targetPort: http
