---
# Non-secret settings for the intake API. ${...} values are filled from .env by `make deploy`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: supervisor
  namespace: disputes
  labels:
    app.kubernetes.io/name: supervisor
    app.kubernetes.io/part-of: dispute-triage
data:
  # Core Systems, for the ownership check before a dispute is stored
  CORE_SYSTEMS_URL: http://core-systems
  FRAUD_AGENT_URL: http://fraud-agent
  LEDGER_AGENT_URL: http://ledger-agent
  JWT_ISSUER: ${JWT_ISSUER}
  JWT_AUDIENCE: ${JWT_AUDIENCE}
  JWT_PUBLIC_KEY_FILE: /etc/jwt/jwt-public.pem
  # Dispute store (ADR-0016): the password is a file mounted from Key Vault, never a value here
  DISPUTE_STORE: postgres
  PGHOST: postgres
  PGDATABASE: disputes
  PGUSER: disputes
  POSTGRES_PASSWORD_FILE: /mnt/secrets/postgres-password
  # Deduplication gate (ADR-0015): one dispute per customer and transaction
  DEDUP_BACKEND: redis
  REDIS_URL: redis://redis:6379/0
  DEDUP_LOCK_SECONDS: "120" # a running intake holds its key this long at most
  DEDUP_RESULT_SECONDS: "86400" # the key points to its dispute for 24 hours
  # Dispute queue (ADR-0018): this service only SENDS; the triage worker receives.
  # No model, signing, or tracing settings here: the intake API does not run triages.
  QUEUE_BACKEND: servicebus
  # A reviewer's approval goes here to be paid (ADR-0027). This process may only send to it.
  REFUNDS_QUEUE: ${REFUNDS_QUEUE}
  SERVICEBUS_NAMESPACE: ${SERVICEBUS_NAMESPACE}
  SERVICEBUS_QUEUE: ${SERVICEBUS_QUEUE}
