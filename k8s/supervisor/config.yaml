---
# Non-secret settings. ${...} values are filled from .env by `make deploy`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: supervisor
  namespace: disputes
  labels:
    app.kubernetes.io/name: supervisor
    app.kubernetes.io/part-of: dispute-triage
data:
  # Other services, by their ClusterIP Service DNS names
  CORE_SYSTEMS_URL: http://core-systems
  FRAUD_AGENT_URL: http://fraud-agent
  LEDGER_AGENT_URL: http://ledger-agent
  AOAI_NAME: ${AOAI_NAME}
  AOAI_DEPLOYMENT: ${AOAI_DEPLOYMENT}
  AOAI_API_VERSION: ${AOAI_API_VERSION}
  JWT_ISSUER: ${JWT_ISSUER}
  JWT_AUDIENCE: ${JWT_AUDIENCE}
  JWT_PUBLIC_KEY_FILE: /etc/jwt/jwt-public.pem
  # Langfuse: the keys are files mounted from Key Vault (see secrets.yaml), never env values
  LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL}
  LANGFUSE_PUBLIC_KEY_FILE: /mnt/secrets/langfuse-public-key
  LANGFUSE_SECRET_KEY_FILE: /mnt/secrets/langfuse-secret-key
  # Refund policy limits (ADR-0007). Changing these is an operational change, not a code change.
  AUTO_REFUND_ENABLED: "true" # kill switch: "false" sends every refund to a human
  AUTO_REFUND_MAX_AMOUNT: "100000.00"
  AUTO_REFUND_MAX_COUNT: "3"
  AUTO_REFUND_MAX_TOTAL: "200000.00"
  AUTO_REFUND_WINDOW_DAYS: "30"
