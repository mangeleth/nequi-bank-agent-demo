---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: core-systems
  namespace: disputes
  labels:
    app.kubernetes.io/name: core-systems
    app.kubernetes.io/part-of: dispute-triage
  annotations:
    # Workload Identity: federated to the managed identity id-core-systems, which may read only
    # the ledger-password secret in Key Vault. It has no Azure OpenAI access: no model runs here.
    azure.workload.identity/client-id: ${WI_CLIENT_ID}
# This service never calls the Kubernetes API, so it gets no API token.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-systems
  namespace: disputes
  labels:
    app.kubernetes.io/name: core-systems
    app.kubernetes.io/part-of: dispute-triage
spec:
  replicas: 2
  revisionHistoryLimit: 5 # previous versions kept for `kubectl rollout undo`
  selector:
    matchLabels:
      app.kubernetes.io/name: core-systems
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below 2 ready pods during a deploy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-systems
        app.kubernetes.io/part-of: dispute-triage
        azure.workload.identity/use: "true" # asks the webhook to inject the identity token
    spec:
      serviceAccountName: core-systems
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread the 2 replicas across our 2 nodes, so losing one node keeps the service up.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: core-systems
          # Count only pods of the same release, so a rolling update spreads the new pods
          # across nodes instead of balancing them against the old ones.
          matchLabelKeys: ["pod-template-hash"]
      containers:
        - name: api
          image: ${IMAGE} # <acr>/core-systems:<git-sha>, set by `make deploy`
          ports:
            - name: http
              containerPort: 8000
          env:
            # One ledger shared by both replicas (ADR-0019). With `in_memory` each pod would
            # keep its own copy, and a refund paid by one would be unknown to the other.
            - name: CORE_SYSTEMS_BACKEND
              value: postgres
            - name: LEDGER_PGHOST
              value: postgres
            - name: LEDGER_PGDATABASE
              value: ledger
            - name: LEDGER_PGUSER
              value: ledger
            - name: LEDGER_PASSWORD_FILE
              value: /mnt/secrets/ledger-password
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi # no CPU limit: avoids throttling; requests guarantee the share
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ledger-password
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ledger-password
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: core-systems-ledger
