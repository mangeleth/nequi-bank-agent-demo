---
# Which Key Vault secret to mount into the Core Systems pods (ADR-0005): the password of the
# ledger's database user. The pods read it with their own Workload Identity, id-core-systems,
# which may read this one secret and nothing else. Nothing here is a secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: core-systems-ledger
  namespace: disputes
  labels:
    app.kubernetes.io/name: core-systems
    app.kubernetes.io/part-of: dispute-triage
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: ${WI_CLIENT_ID}
    tenantId: ${AZURE_TENANT_ID}
    keyvaultName: ${KEYVAULT_NAME}
    objects: |
      array:
        - |
          objectName: ledger-password
          objectType: secret
