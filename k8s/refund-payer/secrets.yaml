---
# Which Key Vault secret to mount into the refund payer (ADR-0005): only the dispute database's
# password. No model key, no tracing keys, no signing key. Nothing here is a secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: refund-payer-secrets
  namespace: disputes
  labels:
    app.kubernetes.io/name: refund-payer
    app.kubernetes.io/part-of: dispute-triage
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: ${WI_CLIENT_ID}
    tenantId: ${AZURE_TENANT_ID}
    keyvaultName: ${KEYVAULT_NAME}
    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret
