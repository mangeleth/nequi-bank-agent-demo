---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: refund-payer
  namespace: disputes
  labels:
    app.kubernetes.io/name: refund-payer
    app.kubernetes.io/part-of: dispute-triage
  annotations:
    # Workload Identity: federated to id-refund-payer, which may receive from the refunds queue and
    # read the dispute database's password. No model access, no signing key, no tracing keys.
    azure.workload.identity/client-id: ${WI_CLIENT_ID}
automountServiceAccountToken: false
---
# The refund payer has no Service: nothing can send it a request. Its work arrives from the
# refunds queue (ADR-0021).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: refund-payer
  namespace: disputes
  labels:
    app.kubernetes.io/name: refund-payer
    app.kubernetes.io/part-of: dispute-triage
spec:
  # ONE replica: the pace (REFUND_PAYMENTS_PER_SECOND) is per process, so one replica makes it
  # the rate the ledger sees. If it dies, payments wait in the queue until Kubernetes restarts it:
  # money is delayed, never lost or paid twice. Production: a shared limit and more replicas.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: refund-payer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0 # never two payers at once during a deploy, so the pace holds
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: refund-payer
        app.kubernetes.io/part-of: dispute-triage
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: refund-payer
      automountServiceAccountToken: false
      # On a deploy or node drain the payer stops taking messages and gets 30 s to finish the
      # payments in progress; Kubernetes must wait longer than that before killing the pod.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payer
          # The supervisor's image, started as the refund payer
          image: ${ACR_NAME}.azurecr.io/supervisor:${IMAGE_TAG}
          command: ["uvicorn", "services.supervisor.payer:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000 # health endpoints only
          envFrom:
            - configMapRef:
                name: refund-payer
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http } # fails if the queue consumer has stopped
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: refund-payer-secrets
