---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: disputes
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: dispute-triage
spec:
  type: ClusterIP # reachable only from inside the cluster: postgres:5432
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
