---
# Which Key Vault secret to mount into the PostgreSQL pod (ADR-0005). The pod reads it with its
# own Workload Identity, which may read this one secret and nothing else. Nothing here is a secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres-password
  namespace: disputes
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: dispute-triage
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: ${WI_CLIENT_ID}
    tenantId: ${AZURE_TENANT_ID}
    keyvaultName: ${KEYVAULT_NAME}
    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret
