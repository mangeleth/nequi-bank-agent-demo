---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: triage-worker
  namespace: disputes
  labels:
    app.kubernetes.io/name: triage-worker
    app.kubernetes.io/part-of: dispute-triage
  annotations:
    # Workload Identity: federated to id-triage-worker, which may receive from the dispute queue,
    # call Azure OpenAI, read its secrets, and ask Key Vault to sign. It cannot send to the queue.
    azure.workload.identity/client-id: ${WI_CLIENT_ID}
automountServiceAccountToken: false
---
# The triage worker has no Service: nothing can send it a request. Its work arrives from the queue.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-worker
  namespace: disputes
  labels:
    app.kubernetes.io/name: triage-worker
    app.kubernetes.io/part-of: dispute-triage
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: triage-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: triage-worker
        app.kubernetes.io/part-of: dispute-triage
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: triage-worker
      automountServiceAccountToken: false
      # On a deploy or node drain the worker stops taking messages and gets 30 s to finish the
      # runs in progress; Kubernetes must wait longer than that before killing the pod.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: triage-worker
          matchLabelKeys: ["pod-template-hash"]
      containers:
        - name: worker
          # The supervisor's image, started as the worker instead of the API
          image: ${ACR_NAME}.azurecr.io/supervisor:${IMAGE_TAG}
          command: ["uvicorn", "services.supervisor.worker:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000 # health endpoints only
          envFrom:
            - configMapRef:
                name: triage-worker
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http } # fails if the queue consumer has stopped
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: triage-worker-secrets
