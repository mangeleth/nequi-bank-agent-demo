---
# Tells the Secrets Store CSI driver which Key Vault secrets to mount into the triage worker pod
# (ADR-0005). The driver logs in to Key Vault as the pod's own Workload Identity, which holds
# "Key Vault Secrets User" on exactly these secrets. Nothing here is a secret.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: triage-worker-secrets
  namespace: disputes
  labels:
    app.kubernetes.io/name: triage-worker
    app.kubernetes.io/part-of: dispute-triage
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: ${WI_CLIENT_ID}
    tenantId: ${AZURE_TENANT_ID}
    keyvaultName: ${KEYVAULT_NAME}
    objects: |
      array:
        - |
          objectName: langfuse-public-key
          objectType: secret
        - |
          objectName: langfuse-secret-key
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
