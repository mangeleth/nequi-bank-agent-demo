---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: disputes
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: dispute-triage
spec:
  type: ClusterIP # reachable only from inside the cluster: redis://redis:6379
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
